{% extends "base.html" %}
{% block title %}Вход — Nomad{% endblock %}
{% block content %}
<section class="auth-card">
  <a class="auth-back" href="/about">← Назад</a>
  <p class="eyebrow">Ваши места ждут</p>
  <h1>Войти в Nomad</h1>
  <p class="muted">Продолжите собирать карту своих воспоминаний.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="auth-form" accept-charset="UTF-8">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Логин<input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
    <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Войти</button>
  </form>
  <p class="switch-link">Нет аккаунта? <a href="/register">Создать</a></p>
</section>
{% endblock %}
