{% extends "base.html" %}
{% block title %}Добавить пароль — Nomad{% endblock %}
{% block content %}
<section class="auth-card">
  <a class="auth-back" href="/account">← Назад</a>
  <p class="eyebrow">Дополнительный способ входа</p>
  <h1>Добавить пароль</h1>
  <p class="muted">После этого вы сможете входить как через Google, так и по логину и паролю.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password/setup" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="ticket" value="{{ ticket }}">
    <label>Логин<input name="username" value="{{ user.username }}" minlength="3" maxlength="64" autocomplete="username" required autofocus></label>
    <label>Новый пароль<input type="password" name="new_password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <label>Повторите пароль<input type="password" name="new_password_confirm" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <button type="submit">Подключить вход по паролю</button>
  </form>
</section>
{% endblock %}
